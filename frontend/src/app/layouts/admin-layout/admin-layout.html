<div class="min-h-screen bg-[#0a0a0a] text-white flex relative overflow-hidden">
  <!-- Mobile Backdrop -->
  <div *ngIf="sidebarVisible()" (click)="closeSidebar()" class="fixed inset-0 bg-black/80 z-40 md:hidden transition-opacity"></div>

  <!-- Sidebar -->
  <aside 
    [ngClass]="sidebarVisible() ? 'translate-x-0' : '-translate-x-full'"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-[#0a0a0a] md:bg-black/50 border-r border-white/10 flex flex-col transform transition-transform duration-300 md:relative md:translate-x-0">
    <div class="p-6 flex items-center justify-between">
      <div>
        <img src="logo.png" alt="Elevate Travel MR" class="h-24 w-auto object-contain mb-4">
        <p class="text-xs text-white/50 tracking-widest mt-1">Backoffice</p>
      </div>
      <button (click)="closeSidebar()" class="md:hidden text-white/50 hover:text-white">
        <i class="pi pi-times text-xl"></i>
      </button>
    </div>

    <nav class="flex-1 px-4 space-y-2 mt-4 md:mt-8 overflow-y-auto">
      <a routerLink="/admin" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{exact: true}" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-home mr-3"></i> Dashboard
      </a>
      <a routerLink="/admin/destinations" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-map-marker mr-3"></i> Destinos
      </a>
      <a routerLink="/admin/events" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-calendar mr-3"></i> Eventos
      </a>
      <a routerLink="/admin/packages" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-briefcase mr-3"></i> Paquetes
      </a>
      <a routerLink="/admin/offers" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-tags mr-3"></i> Ofertas
      </a>
      <a routerLink="/admin/visas" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-id-card mr-3"></i> Visas
      </a>
      <a routerLink="/admin/config" (click)="closeSidebar()" routerLinkActive="bg-white/10 text-white" class="block px-4 py-3 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors">
        <i class="pi pi-cog mr-3"></i> Configuración
      </a>
    </nav>

    <div class="p-4 border-t border-white/10 space-y-2">
      <a routerLink="/" class="w-full flex items-center px-4 py-3 text-white/70 hover:bg-white/5 hover:text-white rounded-lg transition-colors">
        <i class="pi pi-arrow-left mr-3"></i> Volver al Home
      </a>
      <button (click)="logout()" class="w-full flex items-center px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">
        <i class="pi pi-sign-out mr-3"></i> Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col w-full min-w-0 overflow-hidden">
    <header class="h-16 bg-black/30 border-b border-white/10 flex items-center justify-between md:justify-end px-4 md:px-8 shrink-0">
      <button (click)="toggleSidebar()" class="p-2 md:hidden text-white/70 hover:text-white rounded-lg focus:outline-none">
        <i class="pi pi-bars text-xl"></i>
      </button>

      <div class="flex items-center space-x-4">
        <span class="text-sm text-white/70 hidden sm:block">Admin User</span>
        <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
          <i class="pi pi-user text-white/70"></i>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-auto p-4 md:p-8 w-full">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
